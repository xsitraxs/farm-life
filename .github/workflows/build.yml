name: Build Farm Life

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build mod
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --info 2>&1 | tee gradle-build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT_CODE"
          # Show tail for debugging (visible in workflow annotation)
          echo "=== TAIL gradle-build.log ==="
          tail -n 300 gradle-build.log
          # Also save to summary
          echo "## Build log tail" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 200 gradle-build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $EXIT_CODE
      - name: Upload mod jar
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: farm-life-mod
          path: build/libs/*.jar
          if-no-files-found: warn
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: gradle-build.log
          if-no-files-found: warn

