name: Build Farm Life

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build mod
        id: gradle
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --info 2>&1 | tee gradle-build.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT
      - name: Show log excerpt on failure
        if: always()
        run: |
          echo "=== gradle-build.log head ==="
          head -n 200 gradle-build.log || true
          echo "=== tail ==="
          tail -n 400 gradle-build.log || true
          if [ "${{ steps.gradle.outputs.exit_code }}" != "0" ]; then
            echo "::error::Gradle build failed, see log tail above"
            # Create inline annotation with log excerpt (first 10 lines of error)
            ERR=$(grep -A2 -i "error" gradle-build.log | head -n 20 | tr '\n' ' ' | cut -c1-800)
            echo "::error::${ERR}"
            exit 1
          fi
      - name: Upload mod jar
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: farm-life-mod
          path: build/libs/*.jar
          if-no-files-found: warn
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: gradle-build.log
          if-no-files-found: warn
